<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Full Música</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #1db954; font-size: 24px; }
        audio { width: 100%; margin: 20px 0; outline: none; }
        ul { list-style: none; padding: 0; max-height: 350px; overflow-y: auto; }
        li { padding: 12px; margin-bottom: 8px; background: #2a2a2a; border-radius: 5px; cursor: pointer; transition: background 0.2s; font-size: 14px; }
        li:hover { background: #333; }
        li.active { background: #1db954; color: #000; font-weight: bold; }
        .loading { text-align: center; color: #888; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Full Música</h1>
        <audio id="audioPlayer" controls></audio>
        <div id="loading" class="loading">Cargando canciones...</div>
        <ul id="playlist"></ul>
    </div>

    <script>
        const API_KEY = 'AIzaSyCtofsVSDO6Jf1Tclddjn95CknLg01Tp7M';
        const FOLDER_ID = '0B_fjnoyvEhIhS0NuLTJxM3liYmc';
        
        const audioPlayer = document.getElementById('audioPlayer');
        const playlistEl = document.getElementById('playlist');
        const loadingEl = document.getElementById('loading');
        
        let tracks = [];
        let currentIndex = 0;

        async function fetchMusic() {
            try {
                const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&key=${API_KEY}&fields=files(id,name,mimeType)`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.files) {
                    tracks = data.files.filter(file => file.mimeType.startsWith('audio/') || file.name.match(/\.(mp3|m4a|wav|aac)$/i));
                    if (tracks.length === 0) {
                        tracks = data.files;
                    }
                    renderPlaylist();
                    if (tracks.length > 0) {
                        loadTrack(0);
                    }
                }
                loadingEl.style.display = 'none';
            } catch (error) {
                loadingEl.innerText = 'Error al cargar la música.';
                console.error(error);
            }
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.innerText = track.name;
                li.onclick = () => loadTrack(index, true);
                playlistEl.appendChild(li);
            });
        }

        function loadTrack(index, play = false) {
            currentIndex = index;
            const track = tracks[index];
            audioPlayer.src = `https://www.googleapis.com/drive/v3/files/${track.id}?alt=media&key=${API_KEY}`;
            
            document.querySelectorAll('#playlist li').forEach((el, i) => {
                el.classList.toggle('active', i === currentIndex);
            });

            if (play) {
                audioPlayer.play();
            }
        }

        audioPlayer.onended = () => {
            if (currentIndex + 1 < tracks.length) {
                loadTrack(currentIndex + 1, true);
            }
        };

        fetchMusic();
    </script>
</body>
</html>
